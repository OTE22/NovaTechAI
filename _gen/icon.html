<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>icon</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { width: 100vw; height: 100vh; overflow: hidden; }
  .tile {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    background: #070d18;
  }
  body[data-round="1"] .tile { border-radius: 20%; }
  img { width: var(--mark, 62%); height: auto; }
</style>
<script>
  var q = new URLSearchParams(location.search);
  document.addEventListener("DOMContentLoaded", function () {
    document.body.dataset.round = q.get("round") || "0";
    document.documentElement.style.setProperty("--mark", (q.get("mark") || "62") + "%");
  });
</script>
</head>
<body>
  <div class="tile">
    <img src="/assets/img/novatechai-logo.png" alt="NovaTechAI">
  </div>
</body>
</html>
